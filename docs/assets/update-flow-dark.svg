<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="qlib-sync update flow">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker>
<marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
</defs>
<rect width="960" height="330" rx="12" fill="#0d1117"/>
<text x="480" y="38" text-anchor="middle" font-size="17" font-weight="600" fill="#f0f6fc">qlib-sync cn update</text>
<rect x="45" y="70" width="150" height="92" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="120.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#4493f8">1  Check</text>
<text x="120.0" y="124" text-anchor="middle" font-size="12.5" fill="#9198a1">Read the 500-byte</text>
<text x="120.0" y="142" text-anchor="middle" font-size="12.5" fill="#9198a1">release manifest</text>
<rect x="225" y="70" width="150" height="92" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="300.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#4493f8">2  Download</text>
<text x="300.0" y="124" text-anchor="middle" font-size="12.5" fill="#9198a1">Resumable, progress,</text>
<text x="300.0" y="142" text-anchor="middle" font-size="12.5" fill="#9198a1">optional mirror</text>
<line x1="198" y1="116.0" x2="222" y2="116.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="405" y="70" width="150" height="92" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="480.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#4493f8">3  Verify</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12.5" fill="#9198a1">Size + sha256,</text>
<text x="480.0" y="142" text-anchor="middle" font-size="12.5" fill="#9198a1">trade date matches</text>
<line x1="378" y1="116.0" x2="402" y2="116.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="585" y="70" width="150" height="92" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="660.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#4493f8">4  Stage</text>
<text x="660.0" y="124" text-anchor="middle" font-size="12.5" fill="#9198a1">Extract beside live</text>
<text x="660.0" y="142" text-anchor="middle" font-size="12.5" fill="#9198a1">data; no downgrade</text>
<line x1="558" y1="116.0" x2="582" y2="116.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="765" y="70" width="150" height="92" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="840.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#4493f8">5  Swap</text>
<text x="840.0" y="124" text-anchor="middle" font-size="12.5" fill="#9198a1">Rename into place,</text>
<text x="840.0" y="142" text-anchor="middle" font-size="12.5" fill="#9198a1">real Qlib read</text>
<line x1="738" y1="116.0" x2="762" y2="116.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="120.0" y1="165" x2="120.0" y2="204" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#g)"/>
<rect x="35" y="208" width="170" height="52" rx="10" fill="#12261e" stroke="#3fb950"/>
<text x="120.0" y="229" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">Already current</text>
<text x="120.0" y="248" text-anchor="middle" font-size="12" fill="#9198a1">done in ~1 s, no download</text>
<line x1="300.0" y1="165" x2="300.0" y2="204" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w)"/>
<line x1="480.0" y1="165" x2="480.0" y2="204" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w)"/>
<line x1="660.0" y1="165" x2="660.0" y2="204" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w)"/>
<line x1="840.0" y1="165" x2="840.0" y2="204" stroke="#f0883e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#w)"/>
<rect x="219" y="208" width="702" height="52" rx="10" fill="#2d1c0f" stroke="#f0883e"/>
<text x="570.0" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#f0883e">Any failure: the previous dataset is put back untouched</text>
<text x="570.0" y="249" text-anchor="middle" font-size="12" fill="#9198a1">corrupt downloads are discarded, never resumed; a lock blocks concurrent runs</text>
<text x="480" y="308" text-anchor="middle" font-size="12.5" fill="#9198a1">On success: <tspan fill="#3fb950" font-weight="600">new trading days, listed and delisted symbols</tspan> are reported; the old copy is removed or kept with --keep-backup</text>
</svg>
