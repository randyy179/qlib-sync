name: Upstream check

# Weekly check that the community release still has the manifest fields and freshness
# qlib-sync relies on. A failure here means upstream changed, not that our code broke.
on:
  schedule:
    - cron: "17 1 * * 1"   # Mondays 01:17 UTC (09:17 China time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e .
      - name: Check the latest release
        run: .venv/bin/python tools/check_upstream.py
