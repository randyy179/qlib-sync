name: Release

# Publishes to PyPI when a version tag is pushed, using PyPI trusted publishing
# (no token stored in GitHub). Enable it once on pypi.org for this repository and
# the "pypi" environment before the first release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  bundle:
    # The Claude Desktop bundle installs qlib-sync from PyPI, so attach it after publishing.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/mcpb pack mcpb qlib-sync.mcpb
      - run: gh release create "$GITHUB_REF_NAME" qlib-sync.mcpb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
