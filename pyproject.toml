[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "qlib-sync"
version = "0.1.1"
description = "Safely install and update a local Qlib China A-share dataset, with an MCP server for AI assistants."
dynamic = ["readme"]
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "randyy179" }]
keywords = ["qlib", "quant", "a-share", "china", "stock", "market-data", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
# pyqlib publishes wheels for CPython 3.12 at most, hence the upper bound above.
dependencies = ["pyqlib>=0.9.6", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/randyy179/qlib-sync"
Issues = "https://github.com/randyy179/qlib-sync/issues"
Changelog = "https://github.com/randyy179/qlib-sync/releases"

[project.scripts]
qlib-sync = "qlib_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qlib_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# An allowlist, so local notes and scratch files never ship by accident.
include = [
    "src",
    "tests",
    "skills",
    "mcpb",
    "server.json",
    "docs/scheduling.md",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "pyproject.toml",
]

# PyPI renders the README outside the repository, so point relative links at GitHub:
# images at raw files, everything else at the repository browser.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|srcset="|\]\()docs/assets/'
replacement = '\1https://raw.githubusercontent.com/randyy179/qlib-sync/main/docs/assets/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/randyy179/qlib-sync/blob/main/\1)'
