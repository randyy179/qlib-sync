[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlib-sync"
version = "0.1.0"
description = "Operate local Qlib market datasets: transactional updates, health checks, and corporate-action audits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyqlib>=0.9.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
qlib-sync = "qlib_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qlib_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
